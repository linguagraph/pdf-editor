name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      # Hosted Ubuntu runners draw the window about 3x slower than the dev baseline and
      # vary run to run (239-347 ms against the 300 ms first-paint budget): give them headroom
      # without hiding a real regression (tests/benchmarks/test_ui_budgets.py).
      PDFEDITOR_PERF_FACTOR: ${{ matrix.os == 'ubuntu-latest' && '1.5' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run mypy
      - run: uv run python scripts/make_fixtures.py
      - run: uv run python scripts/fetch_tessdata.py
      - run: uv run pytest

  build-exe:
    # The product is a self-contained executable: build it on every PR and smoke-test it frozen.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[build]"
      # Our own launcher: the prebuilt one is flagged by antivirus (#90). MSVC is on the image.
      - run: uv run python scripts/build_bootloader.py
      - run: uv run python scripts/build_exe.py --test --clean-env --no-window-check
      - uses: actions/upload-artifact@v4
        with:
          name: pdfeditor-exe-${{ github.sha }}
          path: dist/Elanero.exe
          retention-days: 14

  build-installer:
    # The Inno Setup installer packs the one-folder app (issue #95). Upgrade a real one-file
    # install made with the last installer of that era, check the result, then uninstall.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the old installer script
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[build]"
      # Our own launcher: the prebuilt one is flagged by antivirus (#90). MSVC is on the image.
      - run: uv run python scripts/build_bootloader.py
      - name: Install Inno Setup if the image lacks it
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: uv run python scripts/build_exe.py --installer --test
      - name: Upgrade a one-file install, self-test it, uninstall it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $silent = '/VERYSILENT', '/CURRENTUSER', '/NORESTART', '/SUPPRESSMSGBOXES'
          function Run-Setup($exe, $arguments) {
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$exe exited with $($p.ExitCode)" }
          }
          $app = "$env:LOCALAPPDATA\Programs\pdfeditor"
          $command = 'HKCU:\Software\Classes\pdfeditor.pdf\shell\open\command'
          $old = "$env:RUNNER_TEMP\old"
          New-Item -ItemType Directory $old | Out-Null

          # The old install: the same exe path, the app inside one file.
          $script = (git show 5c54fca:packaging/installer.iss) -join "`n"
          $script = $script.Replace('@VERSION@', '0.0.1').Replace('@EXE@', "$PWD\dist\Elanero.exe")
          $script = $script.Replace('@OUTDIR@', $old).Replace('@LICENSE@', "$PWD\LICENSE")
          $script = $script.Replace('@ICON@', "$PWD\src\pdfeditor\data\branding\elanero\icons\platform\elanero.ico")
          Set-Content "$old\old.iss" $script
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "$old\old.iss"
          if ($LASTEXITCODE -ne 0) { throw 'old installer did not compile' }
          Run-Setup "$old\pdfeditor-0.0.1-setup.exe" $silent
          if (Test-Path "$app\_internal") { throw 'the old install should be one file' }
          if (-not (Test-Path "$app\Elanero.exe")) { throw 'old install missing' }
          # What a previous folder version could leave behind.
          New-Item -ItemType Directory "$app\_internal" | Out-Null
          Set-Content "$app\_internal\stale.dll" 'stale'

          $setup = Get-ChildItem dist\pdfeditor-*-setup.exe | Select-Object -First 1
          "installer: $([math]::Round($setup.Length / 1MB, 1)) MB"
          Run-Setup $setup.FullName $silent
          if (Test-Path "$app\_internal\stale.dll") { throw 'stale file survived the upgrade' }
          if (-not (Test-Path "$app\_internal\python311.dll")) { throw 'app folder not installed' }
          if ((Get-Item "$app\Elanero.exe").Length -gt 30MB) { throw 'still the one-file exe' }
          $expected = "`"$app\Elanero.exe`" `"%1`""
          if ((Get-Item $command).GetValue('') -ne $expected) { throw 'association does not point at the exe' }
          $report = "$env:RUNNER_TEMP\installer-selftest.txt"
          $p = Start-Process -FilePath "$app\Elanero.exe" -ArgumentList '--self-test','--self-test-report',$report -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          if (-not (Select-String -Path $report -Pattern 'channel: Installer' -Quiet)) { throw 'not detected as installed' }

          Run-Setup "$app\unins000.exe" '/VERYSILENT', '/NORESTART', '/SUPPRESSMSGBOXES'
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep 1 } # it finishes from a temp copy
          if (Test-Path $app) { Get-ChildItem -Recurse $app | Select-Object -First 20 FullName; throw 'files left after uninstall' }
          if (Test-Path $command) { throw 'registry left after uninstall' }

  build-msix:
    # The Microsoft Store package (PLAN.md Phase 18): build it from the one-folder app with the
    # test identity (the real one is git-ignored), then install the .msix itself and run the
    # self-test through its execution alias, as a Store user would get it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[build]"
      # Our own launcher: the prebuilt one is flagged by antivirus (#90). MSVC is on the image.
      - run: uv run python scripts/build_bootloader.py
      - run: uv run python scripts/build_exe.py --msix --sign-test --test --clean-env --no-window-check
      - name: Install the package, self-test it, uninstall it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem dist\Elanero-*-x64.msix | Select-Object -First 1
          # Trust the test certificate the build signed with (the runner is an administrator).
          $password = uv run python -c "import sys; sys.path.insert(0, 'scripts'); import msix_package; print(msix_package.TEST_PFX_PASSWORD)"
          $pfx = Get-PfxData -FilePath build\msix\test-signing.pfx `
              -Password (ConvertTo-SecureString $password -AsPlainText -Force)
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store('TrustedPeople', 'LocalMachine')
          $store.Open('ReadWrite'); $store.Add($pfx.EndEntityCertificates[0]); $store.Close()
          Add-AppxPackage -Path $msix.FullName
          $pkg = Get-AppxPackage -Name 'LinguaGraph.ElaneroPDFEditor'
          if (-not $pkg) { throw 'package not installed' }
          $report = "$env:RUNNER_TEMP\msix-selftest.txt"
          $alias = "$env:LOCALAPPDATA\Microsoft\WindowsApps\Elanero.exe"
          $p = Start-Process -FilePath $alias -ArgumentList '--self-test','--self-test-report',$report -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          if (-not (Select-String -Path $report -Pattern 'channel: Microsoft Store' -Quiet)) { throw 'not detected as packaged' }
          Remove-AppxPackage -Package $pkg.PackageFullName
          if (Get-AppxPackage -Name 'LinguaGraph.ElaneroPDFEditor') { throw 'package still installed' }
      - uses: actions/upload-artifact@v4
        with:
          name: elanero-msix-test-${{ github.sha }}
          path: dist/Elanero-*-x64.msix
          retention-days: 14
