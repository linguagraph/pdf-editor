name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      # Hosted Ubuntu runners draw the window about 3x slower than the dev baseline and
      # vary run to run (239-347 ms against the 300 ms first-paint budget): give them headroom
      # without hiding a real regression (tests/benchmarks/test_ui_budgets.py).
      PDFEDITOR_PERF_FACTOR: ${{ matrix.os == 'ubuntu-latest' && '1.5' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run mypy
      - run: uv run python scripts/make_fixtures.py
      - run: uv run python scripts/fetch_tessdata.py
      - run: uv run pytest

  build-exe:
    # The product is a self-contained executable: build it on every PR and smoke-test it frozen.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[build]"
      - run: uv run python scripts/build_exe.py --test --clean-env --no-window-check
      - uses: actions/upload-artifact@v4
        with:
          name: pdfeditor-exe-${{ github.sha }}
          path: dist/pdfeditor.exe
          retention-days: 14
