name: Release

# A pushed tag vX.Y.Z (RELEASING.md) releases that commit. CI doesn't run after a merge, so the
# full CI run here is what proves it, and it makes the only build of the app:
# - ci: every test, one build, the install tests.
# - github-release: that portable exe and installer, attached to a GitHub release.
# - microsoft-store: that app folder packed as an MSIX with the Partner Center identity, uploaded
#   as a *draft* Store submission. It runs in the protected `microsoft-store` environment, so it
#   waits for the owner's approval, and its secrets (identity and API credentials) exist only there.
# A failed publishing job can be re-run alone: nothing is built or tested again.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/pdfeditor/__init__.py)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} but __version__ is $version"; exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  github-release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: elanero-exe
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: elanero-installer
          path: assets
      - name: Remove a draft left by a failed attempt
        # GitHub can fail mid-way and leave one, and a second release with this tag couldn't publish.
        run: |
          gh api "repos/$GH_REPO/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GH_REPO/releases/$id"; done
      - name: Create the GitHub release
        run: gh release create "$TAG" assets/* --verify-tag --generate-notes --title "Elanero $TAG"

  microsoft-store:
    needs: github-release
    runs-on: windows-latest
    environment: microsoft-store
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e ".[build]"
      - uses: actions/download-artifact@v4
        with:
          name: elanero-folder
          path: dist/Elanero
      - name: Store identity (git-ignored; only on this runner)
        env:
          MSIX_IDENTITY_JSON: ${{ secrets.MSIX_IDENTITY_JSON }}
        shell: pwsh
        run: |
          Set-Content -Path packaging\msix\identity.json -Value $env:MSIX_IDENTITY_JSON -Encoding utf8NoBOM
          uv run python -c "import sys; sys.path.insert(0, 'scripts'); import msix_package; sys.exit(0 if msix_package.load_identity().reserved else 'identity.json is not the reserved Store identity')"
      # Unsigned: the Store signs the package. CI built the app with our own launcher (--all fails
      # otherwise), and this only packs that build, self-testing it first.
      - run: uv run python scripts/build_exe.py --skip-build --msix
      - uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Upload as a draft Store submission
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID `
              --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'msstore reconfigure failed' }
          $msix = Get-ChildItem dist\Elanero-*-x64.msix | Select-Object -First 1
          # --noCommit leaves the submission as a draft: review it in Partner Center and submit.
          msstore publish $msix.FullName --appId $env:MSSTORE_PRODUCT_ID --noCommit
          if ($LASTEXITCODE -ne 0) { throw 'msstore publish failed' }
      - name: Remove the identity from the runner
        if: always()
        shell: pwsh
        run: Remove-Item packaging\msix\identity.json -ErrorAction SilentlyContinue
